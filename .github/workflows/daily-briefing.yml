name: 每日简报

on:
  schedule:
    # UTC 16:30 = 北京时间 0:30: 生成前一天简报后立即推送
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: '运行阶段: all / generate / push'
        required: false
        default: 'all'
      target_date:
        description: '处理日期 YYYY-MM-DD'
        required: false

permissions:
  contents: write

jobs:
  generate:
    if: github.event.inputs.phase != 'push'
    runs-on: ubuntu-latest
    outputs:
      has_articles: ${{ steps.check.outputs.has_articles }}
      briefing_date: ${{ steps.set_date.outputs.briefing_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Set target date
        id: set_date
        run: |
          if [ -n "$TARGET_DATE" ]; then
            echo "briefing_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          else
            echo "briefing_date=$(TZ='Asia/Shanghai' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
      - name: Generate briefing
        continue-on-error: true
        timeout-minutes: 5
        run: python generate_briefing.py
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: "https://api.xiaomimimo.com/v1"
          MIMO_MODEL: "mimo-v2.5"
          TARGET_DATE: ${{ steps.set_date.outputs.briefing_date }}

      - name: Generate OPML feed
        if: always()
        run: python generate_opml.py

      - name: Generate RSS feed
        if: always()
        timeout-minutes: 3
        run: python generate_rss.py
      - name: Commit and push
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add articles/ feed.opml feed.xml deep.xml deep_v2.xml scmp_feed.xml feed2026.xml
          git diff --cached --quiet || (git commit -m "briefing $(date -u +%Y-%m-%d)" && git pull --rebase origin main && git push)
      - name: Upload to COS
        if: always()
        continue-on-error: true
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          pip install cos-python-sdk-v5
          python upload_cos.py
      - name: Check articles
        id: check
        run: |
          BDATE=${{ steps.set_date.outputs.briefing_date }}
          if [ -f "articles/daily/${BDATE}_briefing.json" ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('articles/daily/${BDATE}_briefing.json')); print(len(d.get('articles',[])))")
            echo "has_articles=true" >> $GITHUB_OUTPUT
            echo "Found ${COUNT} articles for ${BDATE}"
          else
            echo "has_articles=false" >> $GITHUB_OUTPUT
            echo "No briefing for ${BDATE}"
          fi

  push:
    needs: [generate]
    if: always() && ((needs.generate.result == 'success' && needs.generate.outputs.has_articles == 'true') || github.event.inputs.phase == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Push to WeChat
        run: python push_briefing.py
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIEFING_DATE: ${{ needs.generate.outputs.briefing_date }}
